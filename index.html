<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DotMatrix — Halftone Effect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --panel: #222;
      --border: #333;
      --text: #fff;
      --muted: #888;
      --accent: #ff3300;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      flex: 1;
    }

    .control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control label {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .control input[type="range"] {
      width: 90px;
      accent-color: var(--accent);
    }

    .control input[type="color"] {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px;
      background: var(--panel);
      cursor: pointer;
    }

    .control select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .control .value {
      font-size: 11px;
      color: var(--muted);
      min-width: 28px;
      text-align: right;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--muted);
      opacity: 1;
    }

    .export-btns {
      display: flex;
      gap: 6px;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    .drop-zone {
      flex: 1;
      border: 2px dashed var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: center;
      padding: 16px;
      min-height: 120px;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(255, 51, 0, 0.05);
    }

    .drop-zone svg {
      width: 32px;
      height: 32px;
      opacity: 0.4;
    }

    .drop-zone p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .preview-wrap {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      opacity: 0.45;
      flex-shrink: 0;
    }

    .preview-wrap img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 140px;
      object-fit: contain;
    }

    .preview-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      min-width: 0;
      background: var(--panel);
      position: relative;
    }

    .canvas-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .placeholder {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    #file-input { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>DotMatrix</h1>
      <div class="controls">
        <div class="control">
          <label for="grid">Grid</label>
          <input type="range" id="grid" min="3" max="20" value="7">
          <span class="value" id="grid-val">7px</span>
        </div>
        <div class="control">
          <label for="maxDot">Max dot</label>
          <input type="range" id="maxDot" min="30" max="100" value="85">
          <span class="value" id="maxDot-val">85%</span>
        </div>
        <div class="control">
          <label for="blur">Blur</label>
          <input type="range" id="blur" min="0" max="20" value="3">
          <span class="value" id="blur-val">3px</span>
        </div>
        <div class="control">
          <label for="dotColor">Dot</label>
          <input type="color" id="dotColor" value="#ff3300">
        </div>
        <div class="control">
          <label for="bgColor">BG</label>
          <input type="color" id="bgColor" value="#1a1a1a">
        </div>
        <div class="control">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="luma">Luma</option>
            <option value="alpha">Alpha</option>
            <option value="inverted">Inverted</option>
          </select>
        </div>
        <div class="export-btns">
          <button class="btn" id="download-svg" disabled>Download SVG</button>
          <button class="btn btn-secondary" id="download-png" disabled>Download PNG</button>
        </div>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="drop-zone" id="drop-zone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 16V4m0 0L8 8m4-4 4 4M4 20h16"/>
          </svg>
          <p>Drop image here<br>or click to upload</p>
        </div>
        <div id="preview-section" style="display:none">
          <div class="preview-label">Source</div>
          <div class="preview-wrap">
            <img id="preview" alt="Source preview">
          </div>
        </div>
      </aside>

      <div class="canvas-area">
        <div class="canvas-wrap" id="canvas-wrap">
          <p class="placeholder" id="placeholder">Upload an image to begin</p>
          <canvas id="canvas" style="display:none"></canvas>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/png,image/jpeg,image/svg+xml,.png,.jpg,.jpeg,.svg">

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const previewSection = document.getElementById('preview-section');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    const downloadSvgBtn = document.getElementById('download-svg');
    const downloadPngBtn = document.getElementById('download-png');

    const gridInput = document.getElementById('grid');
    const maxDotInput = document.getElementById('maxDot');
    const blurInput = document.getElementById('blur');
    const dotColorInput = document.getElementById('dotColor');
    const bgColorInput = document.getElementById('bgColor');
    const modeInput = document.getElementById('mode');
    const gridVal = document.getElementById('grid-val');
    const maxDotVal = document.getElementById('maxDot-val');
    const blurVal = document.getElementById('blur-val');

    let sourceImage = null;
    let debounceTimer = null;
    let lastDots = [];
    let lastDimensions = { W: 0, H: 0 };

    function debounceRender() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(render, 100);
    }

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          preview.src = e.target.result;
          previewSection.style.display = 'block';
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          downloadSvgBtn.disabled = false;
          downloadPngBtn.disabled = false;
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      loadImage(file);
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    function getSettings() {
      return {
        grid: parseInt(gridInput.value, 10),
        maxDot: parseInt(maxDotInput.value, 10) / 100,
        blur: parseInt(blurInput.value, 10),
        dotColor: dotColorInput.value,
        bgColor: bgColorInput.value,
        mode: modeInput.value,
      };
    }

    function pixelVal(data, i, mode) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const a = data[i + 3];
      if (mode === 'luma') return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      if (mode === 'alpha') return a / 255;
      return 1 - (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    }

    function getBlurredPixelData(imgW, imgH, blur) {
      const blurCanvas = document.createElement('canvas');
      blurCanvas.width = imgW;
      blurCanvas.height = imgH;
      const blurCtx = blurCanvas.getContext('2d');
      blurCtx.filter = blur > 0 ? `blur(${blur}px)` : 'none';
      blurCtx.drawImage(sourceImage, 0, 0);
      return blurCtx.getImageData(0, 0, imgW, imgH).data;
    }

    function sampleCell(data, W, H, cx, cy, half, mode) {
      const x0 = Math.max(0, Math.floor(cx - half));
      const x1 = Math.min(W, Math.ceil(cx + half));
      const y0 = Math.max(0, Math.floor(cy - half));
      const y1 = Math.min(H, Math.ceil(cy + half));
      let sum = 0;
      let count = 0;
      for (let py = y0; py < y1; py++) {
        for (let px = x0; px < x1; px++) {
          sum += pixelVal(data, (py * W + px) * 4, mode);
          count++;
        }
      }
      return count > 0 ? sum / count : 0;
    }

    function buildDots(data, W, H, settings) {
      const { grid, maxDot, mode } = settings;
      const half = grid / 2;
      const dots = [];
      for (let y = half; y < H; y += grid) {
        for (let x = half; x < W; x += grid) {
          const val = sampleCell(data, W, H, x, y, half, mode);
          if (val > 0.05) {
            dots.push({ cx: x, cy: y, r: half * val * maxDot });
          }
        }
      }
      return dots;
    }

    function paintCanvas(dots, W, H, dotColor, bgColor) {
      canvas.width = W;
      canvas.height = H;
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = dotColor;
      for (const { cx, cy, r } of dots) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function buildSVG(dots, W, H, dotColor, bgColor) {
      const circles = dots.map(
        ({ cx, cy, r }) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${dotColor}"/>`
      ).join('');
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
        `<rect width="${W}" height="${H}" fill="${bgColor}"/>` +
        circles +
        `</svg>`;
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    }

    function render() {
      if (!sourceImage) return;

      const settings = getSettings();
      const { dotColor, bgColor } = settings;
      const imgW = sourceImage.naturalWidth;
      const imgH = sourceImage.naturalHeight;
      const W = imgW;
      const H = imgH;

      const data = getBlurredPixelData(imgW, imgH, settings.blur);
      lastDots = buildDots(data, W, H, settings);
      lastDimensions = { W, H };

      paintCanvas(lastDots, W, H, dotColor, bgColor);
      scaleCanvasToFit();
    }

    function scaleCanvasToFit() {
      const wrap = document.getElementById('canvas-wrap');
      const availW = wrap.clientWidth;
      const availH = wrap.clientHeight;
      const aspect = canvas.width / canvas.height;

      let displayW, displayH;
      if (availW / availH > aspect) {
        displayH = availH;
        displayW = availH * aspect;
      } else {
        displayW = availW;
        displayH = availW / aspect;
      }

      canvas.style.width = displayW + 'px';
      canvas.style.height = displayH + 'px';
    }

    gridInput.addEventListener('input', () => {
      gridVal.textContent = gridInput.value + 'px';
      debounceRender();
    });
    maxDotInput.addEventListener('input', () => {
      maxDotVal.textContent = maxDotInput.value + '%';
      debounceRender();
    });
    blurInput.addEventListener('input', () => {
      blurVal.textContent = blurInput.value + 'px';
      debounceRender();
    });
    dotColorInput.addEventListener('input', debounceRender);
    bgColorInput.addEventListener('input', debounceRender);
    modeInput.addEventListener('change', debounceRender);

    downloadSvgBtn.addEventListener('click', () => {
      const { dotColor, bgColor } = getSettings();
      const { W, H } = lastDimensions;
      const svg = buildSVG(lastDots, W, H, dotColor, bgColor);
      downloadFile(svg, 'dotmatrix.svg', 'image/svg+xml');
    });

    downloadPngBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'dotmatrix.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    window.addEventListener('resize', () => {
      if (sourceImage) scaleCanvasToFit();
    });
  </script>
</body>
</html>
